<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Healthcare Landing Page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      width:100%;
      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      overflow:hidden;

      background:linear-gradient(135deg, #e0f7fa, #e8f5e9);
    }

    .main-container{
      width:88%;
      height:84vh;

      border-radius:35px;

      position:relative;

      background:rgba(255,255,255,0.28);

      border:1px solid rgba(255,255,255,0.35);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);

      box-shadow:
      0 8px 32px rgba(0,0,0,0.10);

      overflow:hidden;
    }

    .navbar{
      width:90%;
      height:60px;

      position:absolute;
      top:30px;
      left:50%;

      transform:translateX(-50%);

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 28px;
    }

    .logo{
      width:42px;
      height:42px;

      border:none;
      border-radius:14px;

      background:linear-gradient(135deg,#00b7ff,#00d4ff);

      color:white;

      font-size:20px;
      font-weight:700;

      cursor:pointer;

      box-shadow:
      0 4px 16px rgba(0,183,255,0.35);
    }

    .nav-links{
      display:flex;
      gap:42px;
    }

    .nav-links a{
      text-decoration:none;

      color:#1f2937;

      font-size:15px;
      font-weight:600;

      transition:0.3s;
    }

    .nav-links a:hover{
      color:#0099ff;
    }

     .hero{
      width:100%;
      height:100%;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:130px 70px 60px 70px;
    }


    .left{
      width:50%;
    }

    .left h1{
      font-size:58px;

      line-height:1.1;

      color:#111827;

      margin-bottom:22px;

      font-weight:700;
    }

    .left p{
      font-size:15px;

      line-height:1.9;

      color:#4b5563;

      margin-bottom:35px;

      max-width:650px;
    }

    .start-btn{
      padding:16px 34px;

      border:none;

      border-radius:18px;

      font-size:16px;
      font-weight:600;

      cursor:pointer;

      color:white;

      background:linear-gradient(135deg,#00b7ff,#00d4ff);

      transition:0.3s;

      box-shadow:
      0 6px 18px rgba(0,183,255,0.25);
    }

    .start-btn:hover{
      transform:translateY(-3px);
    }

  

    .right{
      width:40%;

      display:flex;
      justify-content:center;
      align-items:center;
    }

    .image-card{
      width:370px;
      height:430px;

      border-radius:35px;

      overflow:hidden;

      background:rgba(255,255,255,0.22);

      border:1px solid rgba(255,255,255,0.30);

      backdrop-filter:blur(14px);

      box-shadow:
      0 10px 30px rgba(0,0,0,0.12);
    }

    .image-card img{
      width:100%;
      height:100%;

      object-fit:cover;
    }

  

    .bottom-buttons{
      position:absolute;

      bottom:28px;
      left:50%;

      transform:translateX(-50%);

      display:flex;
      gap:22px;
    }

    .glass-btn{
      padding:12px 22px;

      border-radius:14px;

      border:1px solid rgba(255,255,255,0.35);

      background:rgba(255,255,255,0.25);

      backdrop-filter:blur(12px);

      cursor:pointer;

      font-size:14px;
      font-weight:600;

      color:#1f2937;

      transition:0.3s;

      box-shadow:
      0 6px 18px rgba(0,0,0,0.06);
    }

    .glass-btn:hover{
      transform:translateY(-4px);

      background:rgba(255,255,255,0.40);
    }

    

    @media(max-width:1000px){

      body{
        height:auto;
        padding:30px 0;
      }

      .main-container{
        height:auto;
        padding-bottom:120px;
      }

      .hero{
        flex-direction:column;
        gap:50px;

        padding:130px 30px 60px 30px;
      }

      .left,
      .right{
        width:100%;
      }

      .left h1{
        font-size:42px;
      }

      .image-card{
        width:100%;
        height:350px;
      }

      .bottom-buttons{
        flex-wrap:wrap;
        justify-content:center;
      }

      .nav-links{
        display:none;
      }

    }

  </style>
</head>

<body>

  <div class="main-container">


    <nav class="navbar">

      <button class="logo">H</button>

      <div class="nav-links">
         <a href="/">Home</a>
         <a href="/dashboard">Dashboard</a>
         <a href="/support">Contact Us</a>
      </div>

      

     

    </nav>

    

    <section class="hero">

      <div class="left">

        <h1>
          Connecting Donors, Hospitals & Lives
        </h1>

        <p>
          Track live blood donation camps, locate nearby hospitals,
          monitor emergency blood requests, and manage healthcare
          support through one smart real-time platform.
        </p>

        <button class="start-btn">
          Get Started
        </button>

      </div>

     

      <div class="right">

        <div class="image-card">

          <img src="https://images.unsplash.com/photo-1584515933487-779824d29309?q=80&w=1974&auto=format&fit=crop" alt="Healthcare">

        </div>

      </div>

    </section>


    <div class="bottom-buttons">

      <button class="glass-btn">Live Map</button>
      <button class="glass-btn">Emergency Alerts</button>
      <button class="glass-btn">Blood Banks</button>

    </div>

  </div>

</body>
</html>
