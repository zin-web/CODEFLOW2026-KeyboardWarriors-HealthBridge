<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="HealthBridge is a healthcare platform that helps users access medical support, health information, and emergency services.">
  <meta name="keywords" content="healthcare, medical support, hospital, emergency, health app">
  <meta name="author" content="Keyboard Warriors">
  <title>HealthBridge - Landing Page</title>

  

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      width:100%;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background: linear-gradient(135deg, #e0f7fa, #e8f5e9);

      linear-gradient(rgba(255,255,255,0.15),rgba(255,255,255,0.15)),
      url('https://images.unsplash.com/photo-1529156069898-49953e39b3ac?q=80&w=2070&auto=format&fit=crop')
      center/cover no-repeat;
    }

    .main-container{
      width:88%;
      height:82vh;
      border-radius:35px;
      position:relative;

      background:rgba(255,255,255,0.14);

      border:1px solid rgba(255,255,255,0.25);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);

      box-shadow:
      0 8px 32px rgba(0,0,0,0.18),
      inset 0 1px 1px rgba(255,255,255,0.2);

      overflow:hidden;
    }
    .navbar{
      width:90%;
      height:60px;

      position:absolute;
      top:35px;
      left:50%;
      transform:translateX(-50%);

      border-radius:25px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 30px;
    }

   
    .nav-links{
      display:flex;
      gap:45px;
    }

    .nav-links a{
      text-decoration:none;
      color:#2b2b2b;
      font-size:16px;
      font-weight:600;
      transition:0.3s;
    }

    .nav-links a:hover{
      color:#0099ff;
    }

  
    .login-btn{
  width:44px;
  height:44px;

  border:none;
  border-radius:14px;

  background:rgba(255,255,255,0.14);

  border:1px solid rgba(255,255,255,0.18);

  backdrop-filter:blur(14px);

  display:flex;
  justify-content:center;
  align-items:center;

  cursor:pointer;

  transition:0.3s;
}


    .hero{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:140px 80px 60px 80px;
    }

    .left{
      width:48%;
    }

    .left h1{
      font-size:48px;
      line-height:1.1;
      color:#111827;
      margin-bottom:22px;
      font-weight:700;
    }

    .left p{
      font-size:14px;
      line-height:1.9;
      color:#444;
      margin-bottom:35px;
      max-width:700px;
    }

    .start-btn{
      padding:18px 34px;
      border:none;
      border-radius:18px;
      margin-top:-15px;
      font-size:18px;
      font-weight:600;

      cursor:pointer;

      background:rgba(255,255,255,0.28);

      backdrop-filter:blur(12px);

      border:1px solid rgba(255,255,255,0.35);

      box-shadow:
      0 8px 18px rgba(0,0,0,0.08);

      transition:0.3s;
    }

    .start-btn:hover{
      transform:translateY(-3px);
      background:rgba(255,255,255,0.4);
    }

    /* RIGHT IMAGE */

    .right{
      width:38%;
      display:flex;
      justify-content:right;
      align-items:center;
    }

    .image-card{
      width:350px;
      height:350px;

      border-radius:35px;

      overflow:hidden;

      background:rgba(255,255,255,0.14);

      border:1px solid rgba(255,255,255,0.28);

      backdrop-filter:blur(14px);

      box-shadow:
      0 10px 30px rgba(0,0,0,0.15);
    }

    .image-card img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* BOTTOM BUTTONS */

    .bottom-buttons{
      position:absolute;
      bottom:28px;
      left:50%;
      transform:translateX(-50%);

      display:flex;
      gap:26px;
    }

    .glass-btn{
      padding:10px 20px;
      border-radius:14px;

      border:1px solid rgba(255,255,255,0.3);

      background:rgba(255,255,255,0.18);

      backdrop-filter:blur(12px);

      cursor:pointer;

      font-size:16px;
      font-weight:600;

      color:#222;

      transition:0.3s;

      box-shadow:
      0 6px 18px rgba(0,0,0,0.08);
    }

    .glass-btn:hover{
      transform:translateY(-4px);
      background:rgba(255,255,255,0.35);
    }

    /* RESPONSIVE */

    /* for Laptop */
@media (max-width:1200px){

  .hero{
    gap:40px;
  }

  .left h1{
    font-size:50px;
  }

  .image-card{
    width:320px;
    height:320px;
  }
}

/* for tablet */
@media (max-width:900px){

  .hero{
    flex-direction:column;
    text-align:center;
  }

  .left,
  .right{
    width:100%;
  }

  .left h1{
    font-size:42px;
  }

  .image-card{
    width:300px;
    height:300px;
  }
}

/* for large mobile */
@media (max-width:600px){

  .left h1{
    font-size:34px;
  }

  .left p{
    font-size:15px;
  }

  .image-card{
    width:260px;
    height:260px;
  }
}

/* for small mobile*/
@media (max-width:480px){

  body{
    padding:20px;
  }

  .hero{
    gap:30px;
  }

  .left h1{
    font-size:28px;
  }

  .left p{
    font-size:14px;
  }

  .start-btn{
    padding:12px 28px;
    font-size:14px;
  }

  .image-card{
    width:220px;
    height:220px;
  }
}


  </style>
</head>

<body>

  <div class="main-container">

   

    <nav class="navbar">

      

      <div class="nav-links">
        <a href="Landing.html">Home</a>
        <a href="index.html">Dashboard</a>
        <a href="support.html">Contact</a>
      </div>

    
    </nav>

    <section class="hero">

      <div class="left">

      <h1>Welcome to HealthBridge</h1>
      <p>Your gateway to comprehensive healthcare support and information.</p>

        <button class="start-btn">
          Get Started
        </button>

      </div>

      <div class="right">

        <div class="image-card">

          <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?q=80&w=2070&auto=format&fit=crop" alt="">

        </div>

      </div>

    </section>
</div>

</body>
</html>
