/* Base (Desktop first design) */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  background: linear-gradient(135deg, #e0f7fa, #e8f5e9);
}

/* HERO SECTION */
.hero {
  width: 90%;
  max-width: 1200px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 60px;
}

/* LEFT SIDE */
.left {
  width: 48%;
}

.left h1 {
  font-size: 58px;
  line-height: 1.1;
  color: #111827;
}

.left p {
  font-size: 18px;
  color: #4b5563;
  margin: 20px 0 35px;
}

/* BUTTON */
.start-btn {
  padding: 15px 38px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s ease;
}

.start-btn:hover {
  background: #1e40af;
  transform: translateY(-2px);
}

/* RIGHT SIDE */
.right {
  width: 38%;
  display: flex;
  justify-content: center;
}

.image-card {
  width: 350px;
  height: 350px;
  border-radius: 25px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
}

.image-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* for Laptop */
@media (max-width:1200px){

  .hero{
    gap:40px;
  }

  .left h1{
    font-size:50px;
  }

  .image-card{
    width:320px;
    height:320px;
  }
}

/* for tablet */
@media (max-width:900px){

  .hero{
    flex-direction:column;
    text-align:center;
  }

  .left,
  .right{
    width:100%;
  }

  .left h1{
    font-size:42px;
  }

  .image-card{
    width:300px;
    height:300px;
  }
}

/* for large mobile */
@media (max-width:600px){

  .left h1{
    font-size:34px;
  }

  .left p{
    font-size:15px;
  }

  .image-card{
    width:260px;
    height:260px;
  }
}

/* for small mobile*/
@media (max-width:480px){

  body{
    padding:20px;
  }

  .hero{
    gap:30px;
  }

  .left h1{
    font-size:28px;
  }

  .left p{
    font-size:14px;
  }

  .start-btn{
    padding:12px 28px;
    font-size:14px;
  }

  .image-card{
    width:220px;
    height:220px;
  }
}
