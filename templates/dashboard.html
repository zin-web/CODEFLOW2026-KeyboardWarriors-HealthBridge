<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HealthBridge Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    
</head>
<body>

    <div class="main-container">
        
        <div class="navbar">
            <h2>HealthBridge</h2>
            <a href="/landing">Home</a>
            <a href="#" class="active">Dashboard</a>
            <a href="/support">Support Page</a>
        </div>

        <div class="content">
            
            <div class="header">
                <h3>Dashboard</h3>
                   
            
            </div>
             <div>
                <h2 class="heading_of_contents">Add Health Events</h2>
                </div>
            <div class="workspace">
               
                
                <div class="left-section">
                    <div id="map-box">
                        <p>[ Leaflet Map Canvas Area - Empty for JS Integration ]</p>
                    </div>

                    <div class="stat-row">
                        <div class="card card-blue">
                            <h5>Total Events</h5>
                            <p id="stat-total">0</p>
                        </div>
                        <div class="card card-green">
                            <h5>Active Camps</h5>
                            <p id="stat-camps">0</p>
                        </div>
                        <div class="card card-red">
                            <h5>Alerts</h5>
                            <p id="stat-alerts">0</p>
                        </div>
                        <div class="card card-cyan">
                            <h5>Drives</h5>
                            <p id="stat-drives">0</p>
                        </div>
                </div>
                </div>

                <div class="right-section">
                    <div class="recent-events-box">
                        <h3>Recent Health Events</h3>
                        <div id="recent-events-feed"></div>
                        <button class="show-more-btn">Show more</button>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <div id="custom-modal" class="modal-overlay modal-hidden">
        <div class="modal-box">
            <h3 class="modal-title">Create New Event</h3>
            <p class="modal-subtitle">Enter Event Title (e.g., Blood Donation Drive, Health Camp):</p>
            
            <input type="text" id="modal-input" placeholder="e.g., Blood Donation Drive" autocomplete="off">
            
            <div class="modal-actions">
                <button id="modal-cancel-btn" class="modal-btn btn-secondary">Cancel</button>
                <button id="modal-submit-btn" class="modal-btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='map.js') }}"></script>

</body>
</html>
