<!DOCTYPE html>
<html lang="en">
  <title>HealthBridge Dashboard</title>
  <style>
    
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f4f6f9;
    overflow-x:hidden;
}
.dashboard-container{
    display:flex;
    min-height:100vh;
}

.sidebar{

    width:290px;
    background:linear-gradient(180deg,#0b4c66,#05354b);
    color:white;
    padding:28px 20px;
    flex-shrink:0;
}
.logo{


    display:flex;

    align-items:center;
    gap:12px;
    margin-bottom:55px;
}

.logo i{

    color:#45d387;

    font-size:30px;
}

.logo h2{

    font-size:28px;

    font-weight:700;
}



.nav-links{
    list-style:none;
}

.nav-links li{
    margin-bottom:14px;
}

.nav-links li a{

 
    display:flex;

    align-items:center;

    gap:15px;

   
    text-decoration:none;

    color:white;

     
    padding:16px 18px;
    border-radius:14px;
    transition:.3s;

    font-size:17px;

    font-weight:500;
}

.nav-links li.active a,
.nav-links li a:hover{

    background:rgba(255,255,255,0.12);
}

.main-content{

    flex:1;

    padding:20px;
}

.topbar{

    display:flex;
    justify-content:space-between;

    align-items:center;

    margin-bottom:22px;

    gap:20px;
}

  </style>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthBridge Dashboard</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-solid fa-heart-pulse"></i>
        <h2>HealthBridge</h2>
      </div>
      <ul class="nav-links">
        <li class="active">
          <a href="#">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fa-solid fa-circle-plus"></i>
            <span>Add Health Event</span>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fa-solid fa-chart-column"></i>
            <span>Analytics</span>
          </a>
        </li>
        <li>
          <a href="#">
          <i class="fa-regular fa-circle-question"></i>
            <span>Support / Info</span>
          </a>
        </li>
      </ul>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <h1>Dashboard</h1>
        <div class="topbar-right">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Filter health events..." />
          </div>
          <div class="top-icons">
            <div class="profile">
              <i class="fa-solid fa-house"></i>

            </div>

          </div>

        </div>

      </header>


      - CONTENT GRID -->
      <div class="content-grid">

        <!-- LEFT PANEL -->
        <section class="left-panel">

          <!-- MAP CARD -->
          <div class="map-card">

            <!-- MAP ZOOM CONTROLS -->
            <div class="map-controls">

              <!-- ZOOM IN -->
              <button>+</button>

              <!-- ZOOM OUT -->
              <button>-</button>
            </div>
          </div>


          <!-- STATS CARDS -->
          <div class="stats-grid">

            <!-- TOTAL EVENTS -->
            <div class="stat-card">

              <!-- ICON -->
              <div class="icon light">

                <i class="fa-regular fa-calendar"></i>

              </div>

              <h4>Total Events:</h4>

              <h2>xxx</h2>

            </div>

            <!-- ACTIVE CAMPS -->
            <div class="stat-card green-card">

              <div class="icon green-bg">

                <i class="fa-solid fa-campground"></i>

              </div>

              <h4>Active Camps:</h4>

              <h2>xxxx</h2>

            </div>

            <!-- EMERGENCY ALERTS -->
            <div class="stat-card red-card">

              <div class="icon red-bg">

                <i class="fa-solid fa-triangle-exclamation"></i>

              </div>

              <h4>Emergency Alerts:</h4>

              <h2>xxxx</h2>

            </div>

            <!-- DONATION DRIVES -->
            <div class="stat-card">

              <div class="icon blue-bg">

                <i class="fa-solid fa-hand-holding-droplet"></i>

              </div>

              <h4>Donation Drives:</h4>

              <h2>xxx</h2>

            </div>

          </div>

          <!-- FOOTER TEXT -->
          <p class="footer-text">

            Focused on Sustainable Development Goals (SDG)

          </p>

        </section>
        <!-- RIGHT PANEL -->
        <aside class="right-panel">

          <!-- EVENTS CARD -->
          <div class="events-card">

            <!-- TITLE -->
            <h2>Recent Health Events</h2>

            <!-- EVENT ITEM -->
            <div class="event-item">

              <!-- EVENT CONTENT -->
              <div class="event-content"></div>

              </div>

            </div>

            <!-- BUTTON -->
            <button class="show-more">
              Show more
            </button>
          </div>
        </aside>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
